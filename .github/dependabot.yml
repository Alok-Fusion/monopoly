# Opens pull requests for dependency updates (weekly, grouped). Major versions are skipped
# for npm packages because they usually need code changes; security fixes still arrive
# through Dependabot security updates whatever the version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # 0.x releases of esbuild can change behaviour in "minor" versions
      - dependency-name: esbuild
        update-types: [version-update:semver-minor]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
